<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musica — Acceso</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px;
    }
    .card {
        width: 100%;
        max-width: 340px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 32px 28px;
        text-align: center;
    }
    .card h1 {
        color: #fff;
        font-size: 1.3rem;
        margin: 0 0 6px;
    }
    .card p {
        color: #8b949e;
        font-size: 0.9rem;
        margin: 0 0 24px;
    }
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #fff;
        font-size: 1rem;
        margin-bottom: 14px;
    }
    input[type="password"]:focus { outline: 2px solid #1db954; border-color: #1db954; }
    button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: #1db954;
        color: #000;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
        color: #f85149;
        font-size: 0.85rem;
        margin-top: 12px;
        min-height: 1em;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>🎵 Musica</h1>
        <p>Introduce la contraseña de acceso</p>
        <form id="login-form" autocomplete="on">
            <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" autofocus required>
            <button type="submit" id="submit-btn">Entrar</button>
            <div class="error" id="error-msg"></div>
        </form>
    </div>
    <script>
        const form = document.getElementById('login-form');
        const btn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            errorMsg.textContent = '';
            try {
                const password = document.getElementById('password').value;
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    location.reload();
                } else {
                    errorMsg.textContent = data.error || 'No se pudo iniciar sesión';
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión, inténtalo de nuevo';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
