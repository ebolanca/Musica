<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica — Modo TV (Google Cast Receiver)</title>
    <!-- Google Cast Application Framework (CAF) Receiver SDK -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v1.0/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --spotify-green: #1db954;
            --active-green: #10b981;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --bg-dark: #0a0e14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 25% 45%, #151a22 0%, #080b0f 100%);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        /* Ocultar reproductor nativo de Google Cast para usar nuestra interfaz personalizada */
        cast-media-player {
            display: none !important;
        }

        .tv-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 40px 60px;
            gap: 60px;
        }

        /* Columna Izquierda: Disco / Carátula / Datos / Progreso */
        .tv-left-panel {
            width: 42%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .tv-cover-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(16, 185, 129, 0.15);
            background: #161b22;
            margin-bottom: 24px;
            transition: transform 0.4s ease;
        }

        .tv-cover-wrapper:hover {
            transform: scale(1.02);
        }

        .tv-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tv-badge-pill {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tv-view-switcher {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tv-view-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tv-view-pill.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tv-track-info {
            width: 100%;
            max-width: 440px;
            margin-bottom: 20px;
        }

        .tv-track-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .tv-track-artist {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--spotify-green);
            margin-bottom: 4px;
        }

        .tv-track-album {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Barra de progreso */
        .tv-progress-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .tv-time-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 42px;
        }

        .tv-progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .tv-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--spotify-green);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
            transition: width 0.25s linear;
        }

        .tv-controls-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tv-btn-ctrl {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-btn-play {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--spotify-green);
            border: none;
            color: #000;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
        }

        /* Columna Derecha: Letras sincronizadas en vivo */
        .tv-right-panel {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .tv-lyrics-scroll {
            height: 85vh;
            overflow: hidden;
            position: relative;
            padding: 300px 0;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        .tv-lyric-line {
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            transition: all 0.35s ease;
            opacity: 0.35;
            transform: scale(0.96);
            transform-origin: left center;
        }

        .tv-lyric-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.35;
        }

        .tv-lyric-trans {
            font-size: 1.15rem;
            font-weight: 500;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.3;
        }

        /* Línea de Karaoke Activa */
        .tv-lyric-line.active {
            opacity: 1;
            transform: scale(1.04);
            background: rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--active-green);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tv-lyric-line.active .tv-lyric-text {
            color: #ffffff;
            font-size: 2.3rem;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .tv-lyric-line.active .tv-lyric-trans {
            color: #34d399;
            font-size: 1.35rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }

        .tv-empty-lyrics {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1.2rem;
            gap: 16px;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>

    <div class="tv-container">
        <!-- Columna Izquierda -->
        <div class="tv-left-panel">
            <div class="tv-cover-wrapper">
                <img id="tv-cover-img" src="" alt="Carátula" class="tv-cover-img">
                <div class="tv-badge-pill" id="tv-badge-pill">
                    <i class="fa-solid fa-music"></i> <span id="tv-badge-artist">Música</span>
                </div>
            </div>

            <div class="tv-view-switcher">
                <div class="tv-view-pill active"><i class="fa-solid fa-camera"></i> Fotos</div>
                <div class="tv-view-pill"><i class="fa-solid fa-record-vinyl"></i> Vinilo</div>
                <div class="tv-view-pill"><i class="fa-solid fa-chart-simple"></i> Ecualizador</div>
            </div>

            <div class="tv-track-info">
                <div class="tv-track-title" id="tv-track-title">Esperando transmisión...</div>
                <div class="tv-track-artist" id="tv-track-artist">Conecta desde la web de Música</div>
                <div class="tv-track-album" id="tv-track-album">Modo TV Sincronizado</div>
            </div>

            <div class="tv-progress-container">
                <span class="tv-time-text" id="tv-time-curr">0:00</span>
                <div class="tv-progress-bar-bg">
                    <div class="tv-progress-fill" id="tv-progress-fill"></div>
                </div>
                <span class="tv-time-text" id="tv-time-dur">0:00</span>
            </div>

            <div class="tv-controls-row">
                <div class="tv-btn-ctrl"><i class="fa-solid fa-backward-step"></i></div>
                <div class="tv-btn-play" id="tv-btn-play"><i class="fa-solid fa-play"></i></div>
                <div class="tv-btn-ctrl"><i class="fa-solid fa-forward-step"></i></div>
            </div>
        </div>

        <!-- Columna Derecha -->
        <div class="tv-right-panel">
            <div class="tv-lyrics-scroll" id="tv-lyrics-scroll">
                <div class="tv-empty-lyrics" id="tv-empty-lyrics">
                    <i class="fa-solid fa-microphone-lines fa-3x" style="opacity: 0.3;"></i>
                    <p>Las letras sincronizadas aparecerán aquí en vivo</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        let parsedLyrics = [];
        let activeLineIndex = -1;

        const coverImg = document.getElementById('tv-cover-img');
        const badgeArtist = document.getElementById('tv-badge-artist');
        const trackTitle = document.getElementById('tv-track-title');
        const trackArtist = document.getElementById('tv-track-artist');
        const trackAlbum = document.getElementById('tv-track-album');
        const timeCurr = document.getElementById('tv-time-curr');
        const timeDur = document.getElementById('tv-time-dur');
        const progressFill = document.getElementById('tv-progress-fill');
        const btnPlay = document.getElementById('tv-btn-play');
        const lyricsScroll = document.getElementById('tv-lyrics-scroll');
        const emptyLyrics = document.getElementById('tv-empty-lyrics');

        function renderLyrics(lines) {
            parsedLyrics = lines || [];
            activeLineIndex = -1;
            lyricsScroll.innerHTML = '';

            if (!parsedLyrics || parsedLyrics.length === 0) {
                lyricsScroll.appendChild(emptyLyrics);
                return;
            }

            parsedLyrics.forEach((line, idx) => {
                const div = document.createElement('div');
                div.className = 'tv-lyric-line';
                div.id = `lyric-line-${idx}`;

                const mainText = document.createElement('div');
                mainText.className = 'tv-lyric-text';
                mainText.textContent = line.text || '';
                div.appendChild(mainText);

                if (line.translation) {
                    const transText = document.createElement('div');
                    transText.className = 'tv-lyric-trans';
                    transText.textContent = line.translation;
                    div.appendChild(transText);
                }

                lyricsScroll.appendChild(div);
            });
        }

        function updateActiveLyric(currentTime) {
            if (!parsedLyrics || parsedLyrics.length === 0) return;

            let newActive = -1;
            for (let i = 0; i < parsedLyrics.length; i++) {
                if (typeof parsedLyrics[i].seconds === 'number') {
                    if (parsedLyrics[i].seconds <= currentTime + 0.25) {
                        newActive = i;
                    }
                }
            }

            if (newActive !== activeLineIndex) {
                activeLineIndex = newActive;

                document.querySelectorAll('.tv-lyric-line').forEach((el, idx) => {
                    if (idx === activeLineIndex) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });

                if (activeLineIndex >= 0) {
                    const activeEl = document.getElementById(`lyric-line-${activeLineIndex}`);
                    if (activeEl) {
                        const targetOffset = activeEl.offsetTop - (lyricsScroll.clientHeight * 0.38);
                        lyricsScroll.style.transform = `translateY(-${Math.max(0, targetOffset)}px)`;
                    }
                } else {
                    lyricsScroll.style.transform = 'translateY(0px)';
                }
            }
        }

        // Inicializar Google Cast Receiver Context
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // Interceptar mensaje LOAD para leer metadata y letras enviadas por el emisor
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            loadRequestData => {
                try {
                    const media = loadRequestData.media;
                    if (media) {
                        const meta = media.metadata || {};
                        const custom = media.customData || {};

                        trackTitle.textContent = meta.title || custom.title || 'Canción';
                        trackArtist.textContent = meta.artist || custom.artist || '';
                        badgeArtist.textContent = meta.artist || custom.artist || 'Música';
                        trackAlbum.textContent = meta.albumName || custom.album || 'Modo TV';

                        const images = meta.images || [];
                        const coverUrl = (images[0] && images[0].url) || custom.coverUrl || '';
                        if (coverUrl) {
                            coverImg.src = coverUrl;
                            coverImg.style.display = 'block';
                        }

                        if (custom.lyrics && Array.isArray(custom.lyrics)) {
                            renderLyrics(custom.lyrics);
                        } else {
                            renderLyrics([]);
                        }
                    }
                } catch(e) {
                    console.error('Error procesando loadRequestData:', e);
                }
                return loadRequestData;
            }
        );

        // Actualización de tiempo en vivo
        playerManager.addEventListener(
            cast.framework.events.EventType.TIME_UPDATE,
            event => {
                const curr = event.currentMediaTime || 0;
                const dur = playerManager.getDurationSec() || 0;

                timeCurr.textContent = formatTime(curr);
                timeDur.textContent = formatTime(dur);

                if (dur > 0) {
                    const pct = Math.min(100, Math.max(0, (curr / dur) * 100));
                    progressFill.style.width = `${pct}%`;
                }

                updateActiveLyric(curr);
            }
        );

        // Actualización de estado (Play / Pause)
        playerManager.addEventListener(
            cast.framework.events.EventType.PLAYER_STATE_CHANGED,
            event => {
                const state = event.playerState;
                if (state === 'PLAYING') {
                    btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } else {
                    btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
                }
            }
        );

        context.start();
        console.log('📡 Google Cast Custom Web Receiver iniciado en la Smart TV');
    </script>
</body>
</html>
